  <!-- Sveltia sucht config.yml sonst im Domain-Root (/config.yml). Da das CMS
       unter /admin läuft, zeigen wir hier explizit auf den tatsächlichen Ort.
       type ist Pflicht: ohne Attribut liefert das DOM einen leeren String, und
       Sveltia lehnt die Datei als „unsupported type" ab. -->
  <link rel="cms-config-url" href="/admin/config.yml" type="application/yaml" />
</head>
<body>
  <!-- Sveltia CMS – moderner, Drop-in-Nachfolger von Decap CMS.
       Das Bundle wird lokal aus dem npm-Paket geladen (self-hosted),
       siehe tools/copy-admin-assets.mjs. config.yml bleibt unverändert. -->
  <div id="nc-root"></div>
  <script src="/admin/sveltia-cms.js"></script>
</body>
</html>
