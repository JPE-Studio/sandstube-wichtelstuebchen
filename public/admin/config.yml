# ═══════════════════════════════════════════════════════════════════════
# Decap CMS Konfiguration – SandStube & Wichtelstübchen
# ═══════════════════════════════════════════════════════════════════════
# Dieses File definiert, was Maria unter /admin sehen und bearbeiten kann.
# Es MUSS mit den JSON-Dateien in src/data/ übereinstimmen.
#
# Der Login läuft über den OAuth-Vermittler aus docker-compose.oauth.yml.
# Wenn dessen Domain sich ändert, muss `base_url` unten mitgeändert werden.
#
# Schreibweisen in den Textfeldern:
#   **Wort**  in einer Überschrift  → der gemalte Schwung darunter
#   **Wort**  in einem Fließtext    → fett
#   {{email}}, {{strasse}}, {{plz_ort}}, {{inhaberin}}, {{jahr}}
#             in Rechtstexten, Footer & Copyright
#                                   → automatisch aus „Kontakt & Stammdaten“
#   wichtelkompass_url              → in einem Footer-Link mit „extern: ja“
# ═══════════════════════════════════════════════════════════════════════

backend:
  name: github
  repo: JPE-Studio/sandstube-wichtelstuebchen
  branch: main
  # OAuth-Vermittler – wird über docker-compose.oauth.yml deployt.
  # Muss exakt die Domain sein, unter der dieser Dienst in Coolify läuft.
  base_url: https://sandstube-auth.jpe-studio.dev
  auth_endpoint: auth

# Lokaler Entwicklungs-Modus: `npx decap-server` parallel laufen lassen
local_backend: true

# Medien – Uploads landen in public/images/ und sind unter /images/... erreichbar
media_folder: "public/images"
public_folder: "/images"

# Editor-UI auf Deutsch
locale: de

collections:

  # ═════════════════════════════════════════════════════════════════════
  # SEITEN – alle Texte und Bilder der sechs Seiten
  # ═════════════════════════════════════════════════════════════════════
  - name: "seiten"
    label: "Seiten"
    delete: false
    create: false
    editor:
      preview: true
    files:

      # ─────────────────────────────────────────────────────────────────
      # Startseite
      # ─────────────────────────────────────────────────────────────────
      - file: "src/data/pages/index.json"
        name: "startseite"
        label: "Startseite"
        fields:
          - label: "Suchmaschine (SEO)"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { name: "titel", label: "Seitentitel", widget: "string" }
              - { name: "beschreibung", label: "Beschreibung", widget: "text" }

          - label: "Kopfbereich"
            name: "hero"
            widget: "object"
            fields:
              - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
              - name: "ueberschrift"
                label: "Große Überschrift"
                widget: "text"
                hint: "Zeilenumbruch = neue Zeile. **Wort** malt den Schwung darunter."
              - { name: "text", label: "Einleitungstext", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
              - { name: "button_sandstube", label: "Button links", widget: "string" }
              - { name: "button_wichtelstuebchen", label: "Button rechts", widget: "string" }
              - { name: "bild", label: "Bild", widget: "image" }
              - { name: "bild_alt", label: "Bildbeschreibung (für Screenreader)", widget: "string" }

          - label: "Zwei Türen"
            name: "tueren"
            widget: "object"
            collapsed: true
            fields:
              - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
              - { name: "ueberschrift", label: "Überschrift", widget: "text" }
              - { name: "text", label: "Einleitungstext", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
              - label: "Karte SandStube"
                name: "sandstube"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "chip", label: "Kleines Etikett", widget: "string" }
                  - { name: "titel", label: "Titel", widget: "string" }
                  - { name: "text", label: "Text", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
                  - { name: "fakten", label: "Kurz-Fakten", widget: "list", field: { name: "wert", label: "Fakt", widget: "string" } }
                  - { name: "button", label: "Button", widget: "string" }
                  - { name: "bild", label: "Bild", widget: "image" }
                  - { name: "bild_alt", label: "Bildbeschreibung", widget: "string" }
              - label: "Karte Wichtelstübchen"
                name: "wichtelstuebchen"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "chip", label: "Kleines Etikett", widget: "string" }
                  - { name: "titel", label: "Titel", widget: "string" }
                  - { name: "text", label: "Text", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
                  - { name: "fakten", label: "Kurz-Fakten", widget: "list", field: { name: "wert", label: "Fakt", widget: "string" } }
                  - { name: "button", label: "Button", widget: "string" }
                  - { name: "bild", label: "Bild", widget: "image" }
                  - { name: "bild_alt", label: "Bildbeschreibung", widget: "string" }

          - label: "Der Unterschied"
            name: "unterschied"
            widget: "object"
            collapsed: true
            fields:
              - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
              - { name: "ueberschrift", label: "Überschrift", widget: "text" }
              - { name: "text", label: "Einleitungstext", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
              - label: "Vergleich SandStube"
                name: "sandstube"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "titel", label: "Titel", widget: "string" }
                  - { name: "untertitel", label: "Untertitel", widget: "string" }
                  - name: "zeilen"
                    label: "Vergleichszeilen"
                    widget: "list"
                    summary: "{{fields.label}}"
                    fields:
                      - { name: "label", label: "Bezeichnung", widget: "string" }
                      - { name: "wert", label: "Inhalt", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
                  - { name: "button", label: "Button", widget: "string" }
              - label: "Vergleich Wichtelstübchen"
                name: "wichtelstuebchen"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "titel", label: "Titel", widget: "string" }
                  - { name: "untertitel", label: "Untertitel", widget: "string" }
                  - name: "zeilen"
                    label: "Vergleichszeilen"
                    widget: "list"
                    summary: "{{fields.label}}"
                    fields:
                      - { name: "label", label: "Bezeichnung", widget: "string" }
                      - { name: "wert", label: "Inhalt", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
                  - { name: "button", label: "Button", widget: "string" }

          - label: "Einblicke (Bildergalerie)"
            name: "einblicke"
            widget: "object"
            collapsed: true
            fields:
              - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
              - { name: "ueberschrift", label: "Überschrift", widget: "text" }
              - { name: "text", label: "Einleitungstext", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
              - name: "bilder"
                label: "Bilder"
                widget: "list"
                summary: "{{fields.alt}}"
                fields:
                  - { name: "bild", label: "Bild", widget: "image" }
                  - { name: "alt", label: "Bildbeschreibung", widget: "string" }
              - { name: "button", label: "Button", widget: "string" }

          - label: "Abschnitt Maria"
            name: "maria"
            widget: "object"
            collapsed: true
            fields:
              - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
              - { name: "ueberschrift", label: "Überschrift", widget: "text" }
              - { name: "text", label: "Text", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
              - { name: "zitat", label: "Zitat (Handschrift)", widget: "text" }
              - { name: "button", label: "Button", widget: "string" }
              - { name: "bild", label: "Bild", widget: "image" }
              - { name: "bild_alt", label: "Bildbeschreibung", widget: "string" }

      # ─────────────────────────────────────────────────────────────────
      # SandStube
      # ─────────────────────────────────────────────────────────────────
      - file: "src/data/pages/sandstube.json"
        name: "sandstube"
        label: "SandStube"
        fields:
          - label: "Suchmaschine (SEO)"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { name: "titel", label: "Seitentitel", widget: "string" }
              - { name: "beschreibung", label: "Beschreibung", widget: "text" }

          - label: "Hinweisstreifen ganz oben"
            name: "topstrip"
            widget: "object"
            collapsed: true
            fields:
              - { name: "hinweis", label: "Handschrift-Einwurf", widget: "string" }
              - { name: "text", label: "Text", widget: "markdown", minimal: true, buttons: ["bold", "italic"], editor_components: [] }
              - { name: "link", label: "Link-Beschriftung", widget: "string" }

          - label: "Kopfbereich"
            name: "hero"
            widget: "object"
            fields:
              - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
              - name: "ueberschrift"
                label: "Große Überschrift"
                widget: "text"
                hint: "Zeilenumbruch = neue Zeile. **Wort** malt den Schwung darunter."
              - { name: "motto", label: "Motto", widget: "string" }
              - { name: "text", label: "Einleitungstext", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
              - { name: "button_buchen", label: "Button links", widget: "string" }
              - { name: "button_preise", label: "Button rechts", widget: "string" }
              - { name: "bild", label: "Bild", widget: "image" }
              - { name: "bild_alt", label: "Bildbeschreibung", widget: "string" }

          - label: "Saison-Hinweis"
            name: "saison"
            widget: "object"
            fields:
              - name: "anzeigen"
                label: "Hinweis anzeigen"
                widget: "boolean"
                default: true
                hint: "Ausschalten, wenn die Sommerpause vorbei ist."
              - { name: "text", label: "Text", widget: "markdown", minimal: true, buttons: ["bold", "italic"], editor_components: [] }

          - label: "Drei Schritte"
            name: "schritte"
            widget: "object"
            collapsed: true
            fields:
              - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
              - { name: "ueberschrift", label: "Überschrift", widget: "text" }
              - name: "eintraege"
                label: "Schritte"
                widget: "list"
                summary: "{{fields.wort}} – {{fields.titel}}"
                fields:
                  - { name: "wort", label: "Schlagwort (Handschrift)", widget: "string" }
                  - { name: "titel", label: "Titel", widget: "string" }
                  - { name: "text", label: "Text", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }

          - label: "Erlebnis-Abschnitt"
            name: "erlebnis"
            widget: "object"
            collapsed: true
            fields:
              - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
              - { name: "ueberschrift", label: "Überschrift", widget: "text" }
              - { name: "text", label: "Text", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
              - { name: "punkte", label: "Aufzählung", widget: "list", field: { name: "wert", label: "Punkt", widget: "string" } }
              - { name: "zitat", label: "Zitat (Handschrift)", widget: "text" }
              - { name: "bild", label: "Bild", widget: "image" }
              - { name: "bild_alt", label: "Bildbeschreibung", widget: "string" }

          - label: "Tickets & Preise"
            name: "tickets"
            widget: "object"
            fields:
              - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
              - { name: "ueberschrift", label: "Überschrift", widget: "text" }
              - { name: "text", label: "Einleitungstext", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
              - { name: "einheit", label: "Zusatz unter dem Preis", widget: "string" }
              - name: "liste"
                label: "Tickets"
                label_singular: "Ticket"
                widget: "list"
                min: 1
                summary: "{{fields.name}} – {{fields.preis}}"
                hint: "Jedes Ticket erscheint als Preiskarte und weiter unten als Buchungskalender."
                fields:
                  - { name: "name", label: "Name", widget: "string" }
                  - { name: "preis", label: "Preis (z. B. „25 €“)", widget: "string" }
                  - { name: "details", label: "Kurzinfo über dem Kalender", widget: "string" }
                  - { name: "text", label: "Beschreibung", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
                  - { name: "punkte", label: "Aufzählung", widget: "list", field: { name: "wert", label: "Punkt", widget: "string" } }
                  - name: "tidycal_path"
                    label: "TidyCal-Pfad"
                    widget: "string"
                    hint: "Der Teil hinter tidycal.com/, z. B. wichtelkompass/sandstubchen-1jx0x68"
                  - name: "hervorheben"
                    label: "Karte hervorheben"
                    widget: "boolean"
                    default: false
                    hint: "Zeigt das Fähnchen und die Akzentfarbe – gedacht für das Geburtstags-Ticket."
              - { name: "hervorhebung", label: "Text auf dem Fähnchen", widget: "string" }
              - { name: "button", label: "Button auf allen Karten", widget: "string" }
              - { name: "tipp", label: "Tipp-Zeile darunter", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }

          - label: "Galerie"
            name: "galerie"
            widget: "object"
            collapsed: true
            fields:
              - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
              - { name: "ueberschrift", label: "Überschrift", widget: "text" }
              - name: "bilder"
                label: "Bilder"
                widget: "list"
                summary: "{{fields.alt}}"
                fields:
                  - { name: "bild", label: "Bild", widget: "image" }
                  - { name: "alt", label: "Bildbeschreibung", widget: "string" }

          - label: "Buchungsbedingungen"
            name: "bedingungen"
            widget: "object"
            collapsed: true
            fields:
              - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
              - { name: "ueberschrift", label: "Überschrift", widget: "text" }
              - name: "karten"
                label: "Karten"
                widget: "list"
                summary: "{{fields.titel}}"
                fields:
                  - { name: "titel", label: "Titel", widget: "string" }
                  - { name: "text", label: "Text", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }

          - label: "Buchung"
            name: "buchung"
            widget: "object"
            collapsed: true
            fields:
              - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
              - name: "ueberschrift"
                label: "Überschrift"
                widget: "text"
                hint: "**Wort** malt den Schwung darunter."
              - { name: "text", label: "Einleitungstext", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
              - name: "hinweis_technik"
                label: "Hinweis unter den Kalendern"
                widget: "markdown"
                minimal: true
                buttons: ["bold", "italic"]
                editor_components: []
                hint: "Die E-Mail-Adresse wird automatisch dahinter gesetzt."
              - label: "Abgrenzungs-Kasten"
                name: "trennung"
                widget: "object"
                fields:
                  - { name: "titel", label: "Titel", widget: "string" }
                  - { name: "text", label: "Text", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }

          - label: "Kontakt & Anfahrt"
            name: "kontakt"
            widget: "object"
            collapsed: true
            hint: "Adresse und E-Mail stehen unter „Kontakt & Stammdaten“."
            fields:
              - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
              - { name: "ueberschrift", label: "Überschrift", widget: "text" }
              - { name: "text", label: "Einleitungstext", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
              - { name: "adresse_titel", label: "Titel Adress-Kachel", widget: "string" }
              - { name: "adresse_link", label: "Beschriftung Karten-Link", widget: "string" }
              - { name: "kontakt_titel", label: "Titel Kontakt-Kachel", widget: "string" }
              - { name: "kontakt_text", label: "Text Kontakt-Kachel", widget: "string" }

      # ─────────────────────────────────────────────────────────────────
      # Wichtelstübchen
      # ─────────────────────────────────────────────────────────────────
      - file: "src/data/pages/wichtelstuebchen.json"
        name: "wichtelstuebchen"
        label: "Wichtelstübchen"
        fields:
          - label: "Suchmaschine (SEO)"
            name: "seo"
            widget: "object"
            collapsed: true
            hint: "Die Beschreibung wird automatisch aus den Eckdaten erzeugt."
            fields:
              - { name: "titel", label: "Seitentitel", widget: "string" }

          - label: "Hinweisstreifen ganz oben"
            name: "topstrip"
            widget: "object"
            collapsed: true
            fields:
              - { name: "hinweis", label: "Handschrift-Einwurf", widget: "string" }
              - { name: "text", label: "Text", widget: "markdown", minimal: true, buttons: ["bold", "italic"], editor_components: [] }
              - { name: "link", label: "Link-Beschriftung", widget: "string" }

          - label: "Kopfbereich"
            name: "hero"
            widget: "object"
            fields:
              - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
              - name: "ueberschrift"
                label: "Große Überschrift"
                widget: "text"
                hint: "Zeilenumbruch = neue Zeile. **Wort** malt den Schwung darunter."
              - { name: "text", label: "Einleitungstext", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
              - { name: "button_anfrage", label: "Button links", widget: "string" }
              - { name: "button_tag", label: "Button rechts", widget: "string" }
              - { name: "bild", label: "Bild", widget: "image" }
              - { name: "bild_alt", label: "Bildbeschreibung", widget: "string" }

          - label: "Zahlen-Kacheln"
            name: "fakten"
            widget: "object"
            collapsed: true
            hint: "Die Zahlen selbst stehen unter „Kontakt & Stammdaten“."
            fields:
              - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
              - { name: "ueberschrift", label: "Überschrift", widget: "text" }
              - { name: "hinweis", label: "Hinweis darunter", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }

          - label: "Räume (Bildergalerie)"
            name: "raeume"
            widget: "object"
            collapsed: true
            fields:
              - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
              - { name: "ueberschrift", label: "Überschrift", widget: "text" }
              - { name: "text", label: "Einleitungstext", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
              - name: "bilder"
                label: "Bilder"
                widget: "list"
                summary: "{{fields.alt}}"
                fields:
                  - { name: "bild", label: "Bild", widget: "image" }
                  - { name: "alt", label: "Bildbeschreibung", widget: "string" }

          - label: "Tagesablauf"
            name: "tagesablauf"
            widget: "object"
            collapsed: true
            fields:
              - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
              - { name: "ueberschrift", label: "Überschrift", widget: "text" }
              - { name: "text", label: "Einleitungstext", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
              - name: "zeilen"
                label: "Zeitblöcke"
                widget: "list"
                summary: "{{fields.von}}–{{fields.bis}} {{fields.titel}}"
                fields:
                  - { name: "von", label: "von", widget: "string" }
                  - { name: "bis", label: "bis", widget: "string" }
                  - { name: "titel", label: "Titel", widget: "string" }
                  - { name: "text", label: "Text", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
              - { name: "zitat", label: "Zitat (Handschrift)", widget: "text" }

          - label: "Eingewöhnung"
            name: "eingewoehnung"
            widget: "object"
            collapsed: true
            fields:
              - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
              - { name: "ueberschrift", label: "Überschrift", widget: "text" }
              - { name: "text", label: "Text", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
              - { name: "punkte", label: "Aufzählung", widget: "list", field: { name: "wert", label: "Punkt", widget: "string" } }
              - { name: "bild", label: "Bild", widget: "image" }
              - { name: "bild_alt", label: "Bildbeschreibung", widget: "string" }

          - label: "Kosten"
            name: "kosten"
            widget: "object"
            collapsed: true
            fields:
              - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
              - { name: "ueberschrift", label: "Überschrift", widget: "text" }
              - label: "Karte Verpflegung"
                name: "verpflegung"
                widget: "object"
                fields:
                  - { name: "titel", label: "Titel", widget: "string" }
                  - { name: "preis", label: "Preis", widget: "string" }
                  - { name: "einheit", label: "Zusatz unter dem Preis", widget: "string" }
                  - { name: "text", label: "Text", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
              - label: "Karte Betreuungsbeitrag"
                name: "beitrag"
                widget: "object"
                fields:
                  - { name: "titel", label: "Titel", widget: "string" }
                  - { name: "preis", label: "Preis", widget: "string" }
                  - { name: "einheit", label: "Zusatz unter dem Preis", widget: "string" }
                  - { name: "text", label: "Text", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
              - label: "Hinweis-Kasten"
                name: "hinweis"
                widget: "object"
                fields:
                  - { name: "titel", label: "Titel", widget: "string" }
                  - { name: "text", label: "Text", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }

          - label: "Team-Abschnitt"
            name: "team"
            widget: "object"
            collapsed: true
            fields:
              - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
              - { name: "ueberschrift", label: "Überschrift", widget: "text" }
              - { name: "text", label: "Text", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
              - { name: "button", label: "Button", widget: "string" }
              - { name: "bild", label: "Bild", widget: "image" }
              - { name: "bild_alt", label: "Bildbeschreibung", widget: "string" }

          - label: "Platzanfrage"
            name: "anfrage"
            widget: "object"
            collapsed: true
            fields:
              - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
              - { name: "ueberschrift", label: "Überschrift", widget: "text" }
              - { name: "text", label: "Einleitungstext", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
              - { name: "button", label: "Beschriftung Wichtelkompass-Button", widget: "string" }
              - label: "Abgrenzungs-Kasten"
                name: "hinweis"
                widget: "object"
                fields:
                  - { name: "titel", label: "Titel", widget: "string" }
                  - { name: "text", label: "Text", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }

      # ─────────────────────────────────────────────────────────────────
      # Team-Seite (die Personen selbst stehen unter „Team“)
      # ─────────────────────────────────────────────────────────────────
      - file: "src/data/pages/team.json"
        name: "team_seite"
        label: "Team-Seite"
        fields:
          - label: "Suchmaschine (SEO)"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { name: "titel", label: "Seitentitel", widget: "string" }
              - { name: "beschreibung", label: "Beschreibung", widget: "text" }

          - label: "Kopfbereich"
            name: "hero"
            widget: "object"
            fields:
              - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
              - name: "ueberschrift"
                label: "Große Überschrift"
                widget: "text"
                hint: "Zeilenumbruch = neue Zeile. **Wort** malt den Schwung darunter."
              - { name: "text", label: "Einleitungstext", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }

          - label: "Zwei Wege (unten)"
            name: "wege"
            widget: "object"
            collapsed: true
            fields:
              - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
              - { name: "ueberschrift", label: "Überschrift", widget: "text" }
              - { name: "text", label: "Einleitungstext", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
              - label: "Karte Wichtelstübchen"
                name: "wichtelstuebchen"
                widget: "object"
                fields:
                  - { name: "chip", label: "Kleines Etikett", widget: "string" }
                  - { name: "titel", label: "Titel", widget: "string" }
                  - { name: "text", label: "Text", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
                  - { name: "button", label: "Button", widget: "string" }
              - label: "Karte SandStube"
                name: "sandstube"
                widget: "object"
                fields:
                  - { name: "chip", label: "Kleines Etikett", widget: "string" }
                  - { name: "titel", label: "Titel", widget: "string" }
                  - { name: "text", label: "Text", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
                  - { name: "button", label: "Button", widget: "string" }

      # ─────────────────────────────────────────────────────────────────
      # Impressum
      # ─────────────────────────────────────────────────────────────────
      - file: "src/data/pages/impressum.json"
        name: "impressum"
        label: "Impressum"
        fields:
          - label: "Suchmaschine (SEO)"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { name: "titel", label: "Seitentitel", widget: "string" }
              - { name: "beschreibung", label: "Beschreibung", widget: "text" }
          - { name: "kicker", label: "Kleine Zeile über der Überschrift", widget: "string" }
          - { name: "ueberschrift", label: "Überschrift", widget: "string" }
          - label: "Gelber Warnkasten"
            name: "warnung"
            widget: "object"
            fields:
              - name: "anzeigen"
                label: "Warnkasten anzeigen"
                widget: "boolean"
                default: true
                hint: "Ausschalten, sobald die Angaben vollständig und geprüft sind."
              - { name: "text", label: "Text", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
          - name: "abschnitte"
            label: "Abschnitte"
            widget: "list"
            summary: "{{fields.ueberschrift}}"
            hint: "{{inhaberin}}, {{strasse}}, {{plz_ort}} und {{email}} werden automatisch eingesetzt."
            fields:
              - { name: "ueberschrift", label: "Zwischenüberschrift", widget: "string" }
              - name: "text"
                label: "Text"
                widget: "markdown"
                buttons: ["bold", "italic", "link", "bulleted-list"]
                editor_components: []

      # ─────────────────────────────────────────────────────────────────
      # Datenschutz
      # ─────────────────────────────────────────────────────────────────
      - file: "src/data/pages/datenschutz.json"
        name: "datenschutz"
        label: "Datenschutzerklärung"
        fields:
          - label: "Suchmaschine (SEO)"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { name: "titel", label: "Seitentitel", widget: "string" }
              - { name: "beschreibung", label: "Beschreibung", widget: "text" }
          - { name: "kicker", label: "Kleine Zeile über der Überschrift", widget: "string" }
          - { name: "ueberschrift", label: "Überschrift", widget: "string" }
          - label: "Gelber Warnkasten"
            name: "warnung"
            widget: "object"
            fields:
              - name: "anzeigen"
                label: "Warnkasten anzeigen"
                widget: "boolean"
                default: true
                hint: "Ausschalten, sobald die Erklärung geprüft ist."
              - { name: "text", label: "Text", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
          - name: "abschnitte"
            label: "Abschnitte"
            widget: "list"
            summary: "{{fields.ueberschrift}}"
            hint: "{{inhaberin}}, {{strasse}}, {{plz_ort}} und {{email}} werden automatisch eingesetzt."
            fields:
              - { name: "ueberschrift", label: "Zwischenüberschrift", widget: "string" }
              - name: "text"
                label: "Text"
                widget: "markdown"
                buttons: ["bold", "italic", "link", "bulleted-list"]
                editor_components: []

      # ─────────────────────────────────────────────────────────────────
      # Fehlerseite (erscheint bei unbekannten Adressen)
      # ─────────────────────────────────────────────────────────────────
      - file: "src/data/pages/404.json"
        name: "fehlerseite"
        label: "Fehlerseite (404)"
        fields:
          - label: "Suchmaschine (SEO)"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { name: "titel", label: "Seitentitel", widget: "string" }
              - { name: "beschreibung", label: "Beschreibung", widget: "text" }
          - { name: "kicker", label: "Kleine Zeile darüber", widget: "string" }
          - name: "ueberschrift"
            label: "Große Überschrift"
            widget: "text"
            hint: "Zeilenumbruch = neue Zeile. **Wort** malt den Schwung darunter."
          - { name: "text", label: "Text", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"], editor_components: [] }
          - { name: "button_start", label: "Button 1", widget: "string" }
          - { name: "button_sandstube", label: "Button 2", widget: "string" }
          - { name: "button_wichtelstuebchen", label: "Button 3", widget: "string" }

  # ═════════════════════════════════════════════════════════════════════
  # NAVIGATION & LAYOUT – Menüs, Header-Marken, Fußzeile, Logos
  # (entspricht src/data/ui.json)
  # ═════════════════════════════════════════════════════════════════════
  - name: "layout"
    label: "Navigation & Layout"
    delete: false
    create: false
    editor:
      preview: true
    files:

      - file: "src/data/ui.json"
        name: "ui"
        label: "Navigation, Marken & Fußzeile"
        fields:

          # ─── Hauptnavigationen ───
          # Wiederkehrende Felder für einen Navigations-Eintrag
          - label: "Hauptnavigationen"
            name: "nav"
            widget: "object"
            collapsed: true
            hint: "Die Menü-Einträge oben. Jede Seite kann ihre eigene Zusammenstellung haben."
            fields:
              - label: "Übersichts-Seite (Hub)"
                name: "hub"
                widget: "list"
                min: 1
                summary: "{{fields.label}}"
                fields:
                  - { name: "label", label: "Beschriftung", widget: "string" }
                  - { name: "href", label: "Link-Ziel", widget: "string" }
                  - { name: "cta", label: "Als Button", widget: "boolean", default: false }
                  - { name: "ghost", label: "Button: nur Kontur", widget: "boolean", default: false }
                  - { name: "accent", label: "Button: Akzentfarbe", widget: "boolean", default: false }
              - label: "SandStube-Seite"
                name: "sandstube"
                widget: "list"
                min: 1
                summary: "{{fields.label}}"
                fields:
                  - { name: "label", label: "Beschriftung", widget: "string" }
                  - { name: "href", label: "Link-Ziel", widget: "string" }
                  - { name: "cta", label: "Als Button", widget: "boolean", default: false }
                  - { name: "ghost", label: "Button: nur Kontur", widget: "boolean", default: false }
                  - { name: "accent", label: "Button: Akzentfarbe", widget: "boolean", default: false }
              - label: "Wichtelstübchen-Seite"
                name: "wichtelstuebchen"
                widget: "list"
                min: 1
                summary: "{{fields.label}}"
                fields:
                  - { name: "label", label: "Beschriftung", widget: "string" }
                  - { name: "href", label: "Link-Ziel", widget: "string" }
                  - { name: "cta", label: "Als Button", widget: "boolean", default: false }
                  - { name: "ghost", label: "Button: nur Kontur", widget: "boolean", default: false }
                  - { name: "accent", label: "Button: Akzentfarbe", widget: "boolean", default: false }
              - label: "Team-Seite"
                name: "team"
                widget: "list"
                min: 1
                summary: "{{fields.label}}"
                fields:
                  - { name: "label", label: "Beschriftung", widget: "string" }
                  - { name: "href", label: "Link-Ziel", widget: "string" }
                  - { name: "cta", label: "Als Button", widget: "boolean", default: false }
                  - { name: "ghost", label: "Button: nur Kontur", widget: "boolean", default: false }
                  - { name: "accent", label: "Button: Akzentfarbe", widget: "boolean", default: false }
              - label: "Rechts-Seiten (Impressum, Datenschutz, 404)"
                name: "rechtsseiten"
                widget: "list"
                min: 1
                summary: "{{fields.label}}"
                fields:
                  - { name: "label", label: "Beschriftung", widget: "string" }
                  - { name: "href", label: "Link-Ziel", widget: "string" }
                  - { name: "cta", label: "Als Button", widget: "boolean", default: false }
                  - { name: "ghost", label: "Button: nur Kontur", widget: "boolean", default: false }
                  - { name: "accent", label: "Button: Akzentfarbe", widget: "boolean", default: false }

          # ─── Marken im Header ───
          - label: "Marken (Header)"
            name: "brand"
            widget: "object"
            collapsed: true
            fields:
              - label: "Hub / Übersicht"
                name: "hub"
                widget: "object"
                fields:
                  - { name: "label", label: "Markenname", widget: "string" }
                  - { name: "sub", label: "Untertitel", widget: "string" }
              - label: "SandStube"
                name: "sandstube"
                widget: "object"
                fields:
                  - { name: "label", label: "Markenname", widget: "string" }
                  - { name: "sub", label: "Untertitel", widget: "string" }
                  - { name: "footernote", label: "Zweite Fußzeile (markenspezifisch)", widget: "string", hint: "Erscheint unten rechts statt des Standard-Hinweises." }
              - label: "Wichtelstübchen"
                name: "wichtelstuebchen"
                widget: "object"
                fields:
                  - { name: "label", label: "Markenname", widget: "string" }
                  - { name: "sub", label: "Untertitel", widget: "string" }
                  - { name: "logo", label: "Header-Logo", widget: "image", hint: "Bild statt SVG-Mark im Header." }

          # ─── Fußzeile ───
          - label: "Fußzeile"
            name: "footer"
            widget: "object"
            collapsed: true
            fields:
              - { name: "logo", label: "Logo oben links", widget: "image" }
              - name: "einleitung"
                label: "Einleitungstext"
                widget: "markdown"
                minimal: true
                buttons: ["bold", "italic"]
                editor_components: []
                hint: "{{inhaberin}} wird automatisch eingesetzt."
              - label: "Spalte SandStube"
                name: "spalte_sandstube"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "tag", label: "Kleines Etikett", widget: "string" }
                  - { name: "titel", label: "Überschrift", widget: "string" }
                  - name: "links"
                    label: "Links"
                    widget: "list"
                    min: 1
                    summary: "{{fields.label}}"
                    fields:
                      - { name: "label", label: "Beschriftung", widget: "string" }
                      - { name: "href", label: "Link-Ziel", widget: "string" }
              - label: "Spalte Wichtelstübchen"
                name: "spalte_wichtelstuebchen"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "tag", label: "Kleines Etikett", widget: "string" }
                  - { name: "titel", label: "Überschrift", widget: "string" }
                  - name: "links"
                    label: "Links"
                    widget: "list"
                    min: 1
                    summary: "{{fields.label}}"
                    fields:
                      - { name: "label", label: "Beschriftung", widget: "string" }
                      - { name: "href", label: "Link-Ziel", widget: "string" }
              - label: "Spalte Kontakt & Rechtliches"
                name: "spalte_kontakt"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "titel", label: "Überschrift", widget: "string" }
                  - name: "links"
                    label: "Links"
                    widget: "list"
                    min: 1
                    summary: "{{fields.label}}"
                    hint: "Bei „extern: ja“ öffnet sich ein neuer Tab. Statt einer URL/Adresse kann auch {{email}} (für mailto-Link) oder {{wichtelkompass_url}} eingetragen werden – wird aus den Stammdaten eingesetzt."
                    fields:
                      - { name: "label", label: "Beschriftung", widget: "string" }
                      - { name: "href", label: "Link-Ziel", widget: "string" }
                      - { name: "extern", label: "Externer Link (neuer Tab)", widget: "boolean", default: false }
              - name: "copyright"
                label: "Copyright-Zeile"
                widget: "string"
                hint: "{{jahr}}, {{inhaberin}}, {{strasse}}, {{plz_ort}} werden automatisch eingesetzt."

          # ─── Zahlen-Kacheln Wichtelstübchen ───
          - label: "Wichtelstübchen – Zahlen-Kacheln"
            name: "wichtel_fakten"
            widget: "object"
            collapsed: true
            hint: "Die kleinen Beschriftungen unter den Zahlen. Die Zahlen selbst stehen unter „Kontakt & Stammdaten“."
            fields:
              - { name: "kinder_label", label: "Text unter Kinderzahl", widget: "string" }
              - { name: "alter_label", label: "Text unter Alter", widget: "string" }
              - { name: "zeiten_label", label: "Text unter Betreuungszeit", widget: "string" }
              - { name: "anerkennung_kuerzel", label: "Großer Wert Anerkennung", widget: "string" }
              - { name: "anerkennung_label", label: "Text unter Anerkennung", widget: "string" }

          # ─── Wichtelkompass-Logo ───
          - label: "Wichtelkompass-Logo"
            name: "wichtelkompass"
            widget: "object"
            collapsed: true
            fields:
              - { name: "logo", label: "Logo", widget: "image" }
              - { name: "logo_alt", label: "Bildbeschreibung (Alt-Text)", widget: "string" }

          # ─── Technik-Texte (Barrierefreiheit) ───
          - label: "Technik-Texte"
            name: "ui_strings"
            widget: "object"
            collapsed: true
            hint: "Kleine Hilfstexte für Screenreader und Tastatur-Nutzer."
            fields:
              - { name: "skip_link", label: "Sprunglink zum Inhalt", widget: "string" }
              - { name: "nav_aria", label: "Beschriftung Hauptnavigation", widget: "string" }
              - { name: "menu_aria", label: "Beschriftung Menü-Button", widget: "string" }
              - { name: "footer_logo_alt", label: "Alt-Text Fußzeilen-Logo (leer = dekorativ)", widget: "string" }

  # ═════════════════════════════════════════════════════════════════════
  # TEAM – die Betreuer:innen (entspricht src/content/team/*.md)
  # ═════════════════════════════════════════════════════════════════════
  - name: "team"
    label: "Team"
    label_singular: "Teammitglied"
    folder: "src/content/team"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    summary: "{{name}} – {{rolle}}"
    sortable_fields: ['reihenfolge', 'name']
    fields:
      - { name: "name", label: "Name", widget: "string" }
      - { name: "rolle", label: "Rolle / Funktion", widget: "string" }
      - name: "foto"
        label: "Foto"
        widget: "image"
        hint: "Quadratisches Porträt funktioniert am besten."
      - name: "reihenfolge"
        label: "Reihenfolge auf der Team-Seite"
        widget: "number"
        default: 1
        value_type: "int"
        min: 1
        max: 99
      - { name: "body", label: "Beschreibungstext", widget: "markdown" }

  # ═════════════════════════════════════════════════════════════════════
  # STAMMDATEN – Kontakt, Zeiten, Preise (seitenübergreifend)
  # ═════════════════════════════════════════════════════════════════════
  - name: "einstellungen"
    label: "Einstellungen"
    delete: false
    create: false
    editor:
      preview: true
    files:

      - file: "src/data/site.json"
        name: "site"
        label: "Kontakt & Stammdaten"
        fields:
          - label: "Kontakt"
            name: "kontakt"
            widget: "object"
            fields:
              - { name: "email", label: "E-Mail-Adresse", widget: "string" }
              - { name: "strasse", label: "Straße & Hausnummer", widget: "string" }
              - { name: "plz_ort", label: "PLZ & Ort", widget: "string" }
              - { name: "maps_url", label: "Google-Maps-Link", widget: "string" }

          - { name: "inhaberin", label: "Name der Inhaberin", widget: "string" }
          - { name: "jahr", label: "Jahr (für Copyright)", widget: "string" }

          - label: "Wichtelstübchen – Eckdaten"
            name: "wichtelstuebchen"
            widget: "object"
            collapsed: true
            fields:
              - { name: "kinder", label: "Anzahl Kinder", widget: "number", value_type: "int" }
              - { name: "alter", label: "Altersspanne", widget: "string" }
              - name: "zeiten"
                label: "Betreuungszeiten"
                widget: "string"
                hint: "Format „6.45–15.15 Uhr“ – der Bindestrich trennt die Zahlen-Kachel."
              - { name: "anerkennung", label: "Anerkennungs-Hinweis (Fußzeile)", widget: "string" }
              - { name: "wichtelkompass_url", label: "Wichtelkompass-Profil-URL", widget: "string" }
