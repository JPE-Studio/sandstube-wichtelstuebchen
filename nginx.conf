server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative Redirects: erhält Schema, Host und Port hinter dem
    # Coolify-Proxy. Sonst würde nginx von HTTPS auf HTTP zurückfallen.
    absolute_redirect off;

    # Astro baut mit format:'directory' nach /sandstube/index.html,
    # die Links auf der Seite zeigen aber auf /sandstube. Diese Reihenfolge
    # liefert die Datei direkt aus – ohne 301 bei jedem internen Klick.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Unbekannte URLs: gestaltete Fehlerseite mit echtem Status 404
    # (ein 200 auf die Startseite wäre ein „Soft 404“ für Suchmaschinen).
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Gebündelte Assets tragen einen Hash im Namen und ändern sich nie
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Die CMS-Konfiguration darf nicht gecacht werden, sonst sieht Maria
    # nach einem Deployment noch die alten Felder.
    location /admin/ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;
}
